name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: PYTHONPATH=. python3 -m pytest -q --durations=25

      - name: Fail if the suite dirtied the working tree
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Test suite left the working tree dirty."
            exit 1
          fi

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Report runner capacity
        run: nproc

      # Worker count defaults to the runner's CPU count, and the committed
      # duration hints dispatch the slowest files first so the long pole never
      # starts late.
      - name: Run every test file in isolation
        run: >-
          PYTHONPATH=. python3 scripts/run_isolated_tests.py
          --report "$RUNNER_TEMP/isolation-report.json"

      - name: Upload isolation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-report
          path: ${{ runner.temp }}/isolation-report.json
          if-no-files-found: warn
