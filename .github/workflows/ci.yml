name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: PYTHONPATH=. python3 -m pytest -q --durations=25

      - name: Fail if the suite dirtied the working tree
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Test suite left the working tree dirty."
            exit 1
          fi

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run every test file in isolation
        run: |
          failed=0
          for f in tests/test_*.py; do
            echo "::group::$f"
            if ! PYTHONPATH=. python3 -m pytest -q -n0 -p no:cacheprovider "$f"; then
              echo "FAILED ALONE: $f"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
