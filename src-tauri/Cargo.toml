[package]
name = "underline"
version = "0.0.0"
description = "Underline mining Pane"
authors = ["you"]
edition = "2021"

[lib]
name = "underline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
